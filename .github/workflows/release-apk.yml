name: Release APK

# Requisitos (una sola vez):
#   1. npx eas-cli login
#   2. npx eas-cli init            (agrega extra.eas.projectId en app.json)
#   3. Crear un token en https://expo.dev/settings/access-tokens
#   4. Guardarlo como secreto EXPO_TOKEN en GitHub:
#      Settings → Secrets and variables → Actions → New repository secret
#
# Cada tag v* compila el APK y crea/actualiza el release de GitHub.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        run: |
          eas build \
            --platform android \
            --profile release-apk \
            --non-interactive \
            --wait \
            --json > build.json

          cat build.json

          APK_URL=$(jq -r '.[0].artifacts.buildUrl // empty' build.json)
          if [ -z "$APK_URL" ]; then
            echo "No se encontró la URL del APK en la salida de EAS." >&2
            exit 1
          fi
          echo "APK_URL=$APK_URL" >> "$GITHUB_ENV"

      - name: Download APK
        run: curl --fail --location "$APK_URL" --output organizer.apk

      - name: Generate checksum
        run: sha256sum organizer.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Organizer ${{ github.ref_name }}
          files: |
            organizer.apk
            SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
